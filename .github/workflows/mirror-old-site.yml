name: Mirror old site (one-off)

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-ftq6by]
    paths: [scripts/mirror-old-site.sh, .github/workflows/mirror-old-site.yml]

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror the Joomla site
        run: bash scripts/mirror-old-site.sh
      - name: Commit mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f _mirror
          git diff --cached --quiet || git commit -m "Mirror of the old Joomla site (temporary)"
          git push
